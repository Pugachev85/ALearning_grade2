# src/main/resources/gateway.yml  (или application-gateway.yml)
spring:
  application:
    name: gateway

  cloud:
    # -----------------------------------------------------------------
    # 1️⃣ Включаем автоматический поиск сервисов в Eureka
    # -----------------------------------------------------------------
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

    # -----------------------------------------------------------------
    # 2️⃣ Описание маршрутов
    # -----------------------------------------------------------------
    gateway:
      routes:

        # -------------------------------------------------------------
        # Маршрут к User‑Service
        # -------------------------------------------------------------
        - id: user-service
          uri: lb://user-service               # «lb» → LoadBalancer → Eureka
          predicates:
            - Path=/api/users/**               # /api/users/** будет попадать сюда
          filters:
            # –‑ Попытка 3‑х повторов, если сервис вернул 503
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
