<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Просмотр пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Просмотр пользователя</h1>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${user.name}"></h5>
            <p class="card-text"><strong>ID:</strong> <span th:text="${user.id}"></span></p>
            <p class="card-text"><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p class="card-text"><strong>Возраст:</strong> <span th:text="${user.age}"></span></p>
            <p class="card-text"><strong>Дата создания:</strong>
                <span th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm:ss')}"></span>
            </p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{|/users/${user.id}/edit|}" class="btn btn-warning">Редактировать</a>
        <form th:action="@{|/users/${user.id}|}" method="post" style="display:inline;">
            <input type="hidden" name="_method" value="DELETE"/>
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Вы уверены, что хотите удалить этого пользователя?')">
                Удалить
            </button>
        </form>
        <a th:href="@{/users}" class="btn btn-secondary">Назад к списку</a>
    </div>
</div>
</body>
</html>
